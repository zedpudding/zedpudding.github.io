<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Zander Vera</title>
<meta name="description" content="Contact Zander Vera.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="images/2-Cats-pico-wink.png">
<link rel="preload" as="image" href="images/2-Cats-pico-closed.png">
<link rel="preload" as="image" href="images/2-Cats-pico-half.png">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'Wingman';
    src:url('fonts/TAYWingman.woff2') format('woff2'), url('fonts/TAYWingman.woff') format('woff');
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --paper: #F2F0EA;
    --ink: #1A1917;
    --red: #8C2A2A;
    --muted: #8A8577;
    --max: 1680px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Atkinson Hyperlegible', Arial, sans-serif;
    font-size:18px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  ::selection{background:var(--red);color:#fff;}

  .bottom-nav,
  .eyebrow,
  h1,
  .hero-sign,
  .work-index,
  .work-name,
  .book-title-pre,
  .book-title-post,
  .book-title,
  .book a.buy,
  .book-proof h2,
  .book-caption,
  .book-pull,
  .about-lead,
  .role-title,
  .client-list h2,
  .contact-lead,
  .contact-list span.label,
  .project-title,
  .back-link,
  .hero-deck,
  .case-meta dt,
  .section-note h2,
  .logo-formula figcaption,
  .campaign-title,
  .ad-gallery-header h2,
  .book-lightbox-button{
    font-family:'Wingman', Impact, sans-serif;
    font-weight:400;
  }

  .bottom-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:50;
    padding:0;
    background:linear-gradient(to top, var(--paper) 45%, transparent 100%);
  }
  .bottom-bar-inner{
    width:min(100%, 1680px);
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    gap:18px;
    padding:40px 32px 18px;
  }
  .bottom-cat-wrap{
    position:relative;
    bottom:-34px;
    width:121px;
    display:block;
    flex:0 0 auto;
    pointer-events:none;
  }
  .bottom-cat{
    width:100%;
    height:auto;
    display:block;
    mix-blend-mode:multiply;
  }
  .bottom-cat-wink,
  .bottom-cat-closed,
  .bottom-cat-half{
    position:absolute;
    inset:0;
    width:100%;
    height:auto;
    display:block;
    mix-blend-mode:multiply;
    opacity:0;
  }
  .bottom-cat-wrap.is-winking .bottom-cat{opacity:0;}
  .bottom-cat-wrap.is-winking .bottom-cat-wink{opacity:1;}
  .bottom-cat-wrap.is-love-half .bottom-cat{opacity:0;}
  .bottom-cat-wrap.is-love-half .bottom-cat-half{opacity:1;}
  .bottom-cat-wrap.is-loving .bottom-cat{opacity:0;}
  .bottom-cat-wrap.is-loving .bottom-cat-closed{opacity:1;}
  .bottom-nav{
    display:flex;
    flex-wrap:wrap;
    gap:0;
    font-weight:400;
    font-size:16px;
    letter-spacing:0;
    text-transform:uppercase;
    color:var(--red);
    padding-bottom:8px;
  }
  .bottom-nav a{text-decoration:none; opacity:.85; transition:opacity .15s;}
  .bottom-nav a:hover,
  .bottom-nav a.current{opacity:1;}
  .bottom-nav .sep{margin:0 10px; opacity:.5;}

  main{max-width:var(--max); margin:0 auto; padding:0 48px;}
  section{padding:130px 0;}

  .eyebrow{
    font-weight:400;
    font-size:14px;
    letter-spacing:0;
    text-transform:uppercase;
    color:var(--red);
    margin-bottom:8px;
  }
  .eyebrow .num{color:var(--muted); margin-right:8px;}
  .contact-lead{
    font-weight:400;
    font-size:clamp(54px,8vw,88px);
    line-height:.9;
    margin:18px 0 56px 0;
  }
  .contact-lead i{color:var(--red); font-style:italic;}
  .contact-list{list-style:none; margin:0; padding:0; display:grid; gap:0;}
  .contact-list li{
    padding:20px 0;
    border-top:1px solid #DAD5C8;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:24px;
  }
  .contact-list li:last-child{border-bottom:1px solid #DAD5C8;}
  .contact-list a{text-decoration:none; color:var(--ink); font-weight:700; font-size:20px;}
  .contact-list a:hover{color:var(--red);}
  .contact-list span.label{
    font-family:'Wingman', Impact, sans-serif;
    color:var(--muted);
    letter-spacing:0;
    text-transform:uppercase;
    font-size:15px;
    font-weight:400;
  }

  @media (max-width:600px){
    body{font-size:16px;}
    section{padding:80px 0;}
    .contact-list li{align-items:flex-start; flex-direction:column; gap:4px;}
    .contact-list a{font-size:18px;}
    .bottom-bar-inner{padding:30px 18px 12px; gap:12px;}
    .bottom-cat-wrap{width:86px; bottom:-24px;}
    .bottom-nav{font-size:13px;}
    .bottom-nav .sep{margin:0 6px;}
  }
</style>
</head>
<body>

<main>
  <section>
    <div class="eyebrow"><span class="num">—</span>Contact</div>
    <p class="contact-lead">Let's <i>talk.</i></p>
    <ul class="contact-list">
      <li><span class="label">Email</span><a href="mailto:zander@zndrcrtv.com">zander@zndrcrtv.com</a></li>
      <li><span class="label">LinkedIn</span><a href="https://linkedin.com/in/zandervera" target="_blank" rel="noopener">linkedin.com/in/zandervera</a></li>
    </ul>
  </section>
</main>

<div class="bottom-bar">
  <div class="bottom-bar-inner">
  <span class="bottom-cat-wrap">
    <img class="bottom-cat" src="images/2-Cats-pico.png" alt="Illustration of a cat peeking up">
    <img class="bottom-cat-wink" src="images/2-Cats-pico-wink.png" alt="" aria-hidden="true">
    <img class="bottom-cat-closed" src="images/2-Cats-pico-closed.png" alt="" aria-hidden="true">
    <img class="bottom-cat-half" src="images/2-Cats-pico-half.png" alt="" aria-hidden="true">
  </span>
  <nav class="bottom-nav" aria-label="Primary">
    <a href="index.html">Home</a><span class="sep">|</span><a href="work.html">Work</a><span class="sep">|</span><a href="about.html">About</a><span class="sep">|</span><a href="book.html">Books</a><span class="sep">|</span><a href="contact.html" class="current">Contact</a>
  </nav>
  </div>
</div>

<script>
(() => {
  const cats = document.querySelectorAll('.bottom-cat-wrap');
  if (!cats.length || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let lastMove = '';
  let repeatCount = 0;
  const nextDelay = () => 6500 + Math.random() * 10500;
  const chooseMove = () => {
    let move = Math.random() < 0.45 ? 'love' : 'wink';
    if (move === lastMove) repeatCount += 1;
    else repeatCount = 0;
    if (repeatCount > 1 && Math.random() < 0.7) move = move === 'love' ? 'wink' : 'love';
    repeatCount = move === lastMove ? repeatCount : 0;
    lastMove = move;
    return move;
  };
  const runLoveBlink = () => {
    cats.forEach((cat) => cat.classList.add('is-love-half'));
    window.setTimeout(() => {
      cats.forEach((cat) => {
        cat.classList.remove('is-love-half');
        cat.classList.add('is-loving');
      });
    }, 180);
    window.setTimeout(() => {
      cats.forEach((cat) => {
        cat.classList.remove('is-loving');
        cat.classList.add('is-love-half');
      });
    }, 900);
    window.setTimeout(() => cats.forEach((cat) => cat.classList.remove('is-love-half')), 1120);
    return 1120;
  };
  const runWink = () => {
    cats.forEach((cat) => cat.classList.add('is-winking'));
    window.setTimeout(() => cats.forEach((cat) => cat.classList.remove('is-winking')), 420);
    return 420;
  };
  const animateCat = () => {
    const duration = chooseMove() === 'love' ? runLoveBlink() : runWink();
    window.setTimeout(animateCat, duration + nextDelay());
  };
  window.setTimeout(animateCat, 2800 + Math.random() * 6000);
})();
</script>

</body>
</html>
