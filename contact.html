<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Zander Vera</title>
<meta name="description" content="Contact Zander Vera.">
<link rel="preload" as="image" href="images/2-Cats-pico-wink.png">
<link rel="preload" as="image" href="images/2-Cats-pico-closed.png">
<link rel="preload" as="image" href="images/2-Cats-pico-half.png">
<style>
  @font-face{
    font-family:'Wingman';
    src:url('fonts/TAYWingman.woff2') format('woff2'), url('fonts/TAYWingman.woff') format('woff');
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --paper: #F2F0EA;
    --ink: #1A1917;
    --red: #8C2A2A;
    --muted: #8A8577;
    --max: 1680px;
  }
  *{box-sizing:border-box;}
  html{
    scroll-behavior:smooth;
    overflow-y:scroll;
  }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Wingman', sans-serif;
    font-size:19px;
    line-height:1.30;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  ::selection{background:var(--red);color:#fff;}

  .bottom-nav,
  .eyebrow,
  h1,
  .hero-sign,
  .work-index,
  .work-name,
  .book-title-pre,
  .book-title-post,
  .book-title,
  .book a.buy,
  .book-proof h2,
  .book-caption,
  .book-pull,
  .about-lead,
  .role-title,
  .client-list h2,
  .contact-lead,
  .contact-list span.label,
  .project-title,
  .back-link,
  .hero-deck,
  .case-meta dt,
  .section-note h2,
  .logo-formula figcaption,
  .campaign-title,
  .ad-gallery-header h2,
  .book-lightbox-button{
    font-family:'Wingman', sans-serif;
    font-weight:400;
  }

  .bottom-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:50;
    padding:0;
    background:linear-gradient(to top, var(--paper) 45%, transparent 100%);
    pointer-events:none;
  }
  .bottom-bar-inner{
    width:min(100%, 1680px);
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    gap:18px;
    padding:40px 32px 18px;
  }
  .bottom-cat-wrap{
    position:relative;
    bottom:-34px;
    width:121px;
    display:block;
    flex:0 0 auto;
    pointer-events:none;
  }
  .bottom-cat{
    width:100%;
    height:auto;
    display:block;
    mix-blend-mode:multiply;
  }
  .bottom-cat-wink,
  .bottom-cat-closed,
  .bottom-cat-half{
    position:absolute;
    inset:0;
    width:100%;
    height:auto;
    display:block;
    mix-blend-mode:multiply;
    opacity:0;
  }
  .bottom-cat-wrap.is-winking .bottom-cat{opacity:0;}
  .bottom-cat-wrap.is-winking .bottom-cat-wink{opacity:1;}
  .bottom-cat-wrap.is-love-half .bottom-cat{opacity:0;}
  .bottom-cat-wrap.is-love-half .bottom-cat-half{opacity:1;}
  .bottom-cat-wrap.is-loving .bottom-cat{opacity:0;}
  .bottom-cat-wrap.is-loving .bottom-cat-closed{opacity:1;}
  .bottom-nav{
    display:flex;
    flex-wrap:wrap;
    gap:0;
    font-weight:400;
    font-size:17px;
    letter-spacing:0;
    text-transform:uppercase;
    color:var(--red);
    padding-bottom:8px;
    pointer-events:auto;
  }
  .bottom-nav a{text-decoration:none; opacity:.85; transition:opacity .15s;}
  .bottom-nav a:hover,
  .bottom-nav a.current{opacity:1;}
  .bottom-nav .sep{margin:0 10px; opacity:.5;}

  main{max-width:var(--max); margin:0 auto; padding:0 48px;}
  section{padding:110px 0 150px;}

  .eyebrow{
    font-weight:400;
    font-size:17px;
    letter-spacing:0;
    text-transform:uppercase;
    color:var(--red);
    margin-bottom:8px;
  }
  .eyebrow .num{color:var(--muted); margin-right:8px;}
  .contact-lead{
    font-weight:400;
    font-size:clamp(46px, 4.5vw, 92px);
    line-height:.80;
    letter-spacing:-.120em;
    word-spacing:.025em;
    text-transform:uppercase;
    margin:18px 0 28px 0;
  }
  .contact-lead i{color:var(--red); font-style:italic;}
  .contact-note{
    max-width:620px;
    margin:0 0 38px;
    color:var(--muted);
    font-family:'Wingman', sans-serif;
    font-size:clamp(19px, 1.5vw, 25px);
    font-weight:400;
    line-height:1.05;
    letter-spacing:0;
    text-transform:uppercase;
  }
  .contact-form{
    display:grid;
    gap:22px;
    max-width:1180px;
  }
  .madlib-copy{
    max-width:1120px;
    margin:0;
    color:var(--ink);
    font-family:'Wingman', sans-serif;
    font-size:clamp(25px, 2.55vw, 42px);
    font-weight:400;
    line-height:1.62;
    letter-spacing:-.025em;
    text-transform:uppercase;
  }
  .madlib-copy i{
    color:var(--red);
    font-style:italic;
  }
  .note-field{
    display:inline-flex;
    flex-direction:column;
    gap:4px;
    vertical-align:middle;
    min-width:min(100%, 270px);
    margin:0 .08em -.12em;
  }
  .note-field--short{min-width:min(100%, 220px);}
  .note-field--email{min-width:min(100%, 330px);}
  .note-field--wide{min-width:min(100%, 520px);}
  .form-label{
    color:var(--muted);
    font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:11px;
    font-weight:600;
    line-height:1.1;
    padding-top:3px;
    letter-spacing:0;
    text-align:center;
    text-transform:none;
    white-space:normal;
  }
  .contact-form input{
    width:100%;
    border:0;
    border-bottom:2px solid #DAD5C8;
    border-radius:0;
    background:transparent;
    color:var(--red);
    font-family:'Wingman', sans-serif;
    font-size:clamp(22px, 2.1vw, 34px);
    font-weight:400;
    line-height:1;
    letter-spacing:-.02em;
    text-transform:uppercase;
    outline:none;
    padding:0 0 4px;
  }
  .contact-form input:focus{
    border-bottom-color:var(--red);
    color:var(--ink);
  }
  .project-picker{
    position:relative;
    min-width:min(100%, 285px);
  }
  .project-picker__button{
    position:relative;
    width:100%;
    border:0;
    border-bottom:2px solid #DAD5C8;
    border-radius:0;
    background:transparent;
    color:var(--red);
    font-family:'Wingman', sans-serif;
    font-size:clamp(20px, 1.9vw, 30px);
    font-weight:400;
    line-height:1;
    letter-spacing:-.025em;
    text-align:left;
    text-transform:uppercase;
    cursor:pointer;
    outline:none;
    padding:0 0 4px 28px;
  }
  .project-picker__button::before{
    content:"";
    position:absolute;
    left:0;
    top:50%;
    width:0;
    height:0;
    border-top:7px solid transparent;
    border-bottom:7px solid transparent;
    border-left:11px solid var(--red);
    transform:translateY(-54%);
    transition:transform .18s ease;
  }
  .project-picker.is-open .project-picker__button,
  .project-picker__button:focus-visible{
    border-bottom-color:var(--red);
    color:var(--ink);
  }
  .project-picker.is-open .project-picker__button::before{
    transform:translateY(-54%) rotate(90deg);
  }
  .project-picker__menu{
    position:absolute;
    z-index:20;
    left:0;
    right:0;
    top:calc(100% + 8px);
    display:grid;
    gap:2px;
    margin:0;
    padding:8px 0;
    list-style:none;
    background:var(--paper);
    border-top:1px solid #DAD5C8;
    border-bottom:1px solid #DAD5C8;
    box-shadow:0 18px 30px rgba(26, 25, 23, .08);
    opacity:0;
    transform:scaleY(.74) translateY(-8px);
    transform-origin:top;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  .project-picker.is-open .project-picker__menu{
    opacity:1;
    transform:scaleY(1) translateY(0);
    pointer-events:auto;
  }
  .project-picker__option{
    display:block;
    width:100%;
    border:0;
    background:transparent;
    color:var(--ink);
    font-family:'Wingman', sans-serif;
    font-size:22px;
    line-height:1;
    letter-spacing:0;
    text-align:left;
    text-transform:uppercase;
    cursor:pointer;
    padding:8px 14px 6px 28px;
  }
  .project-picker__option:hover,
  .project-picker__option:focus-visible,
  .project-picker__option.is-selected{
    color:var(--red);
    outline:none;
  }
  .contact-form > button[type="submit"]{
    justify-self:start;
    margin-top:4px;
    border:1px solid var(--red);
    background:var(--red);
    color:#fff;
    padding:15px 28px 12px;
    font-family:'Wingman', sans-serif;
    font-size:19px;
    line-height:1;
    letter-spacing:0;
    text-transform:uppercase;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .contact-form > button[type="submit"]:hover,
  .contact-form > button[type="submit"]:focus-visible{
    background:transparent;
    color:var(--red);
    outline:none;
  }
  .form-status{
    min-height:24px;
    margin:0;
    color:var(--muted);
    font:700 15px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .form-status.is-success{color:var(--red);}
  .form-status.is-error{color:var(--ink);}
  .contact-form.is-sending > button[type="submit"]{
    opacity:.6;
    cursor:wait;
  }

  @media (max-width:600px){
    body{font-size:19px;}
    section{padding:80px 0;}
    main{padding:0 24px;}
    .contact-form{gap:28px;}
    .contact-note{font-size:19px;}
    .madlib-copy{font-size:29px; line-height:1.46;}
    .note-field,
    .note-field--short,
    .note-field--email,
    .note-field--wide{display:grid; min-width:100%; width:100%; margin:8px 0 4px;}
    .form-label{text-align:left;}
    .contact-form input{font-size:30px;}
    .project-picker,
    .project-picker__button{width:100%;}
    .project-picker__button{font-size:28px;}
    .project-picker__option{font-size:21px;}
    .bottom-bar-inner{padding:30px 18px 12px; gap:12px;}
    .bottom-cat-wrap{width:86px; bottom:-24px;}
    .bottom-nav{font-size:17px;}
    .bottom-nav .sep{margin:0 6px;}
  }
</style>
</head>
<body>

<main>
  <section>
    <div class="eyebrow"><span class="num">—</span>Contact</div>
    <p class="contact-lead">Let's <i>talk.</i></p>
    <p class="contact-note">A note is better than a form. Send the shape of the thing and I will get back to you soon.</p>
    <form class="contact-form" id="contact-form" action="https://formspree.io/f/xnjezelw" method="POST">
      <input type="hidden" name="_subject" value="New message from zandervera.com">
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none">
      <div class="madlib-copy">
        Hello Zander, my name is
        <label class="note-field note-field--short">
          <input type="text" name="name" autocomplete="name" required>
          <span class="form-label">(your name)</span>
        </label>
        and I'm writing about
        <span class="note-field">
          <input type="hidden" name="project" id="project-value" value="creative direction">
          <span class="project-picker" data-project-picker>
            <button class="project-picker__button" type="button" aria-haspopup="listbox" aria-expanded="false">creative direction</button>
            <ul class="project-picker__menu" role="listbox">
              <li><button class="project-picker__option is-selected" type="button" role="option" aria-selected="true" data-value="creative direction">creative direction</button></li>
              <li><button class="project-picker__option" type="button" role="option" aria-selected="false" data-value="brand identity">brand identity</button></li>
              <li><button class="project-picker__option" type="button" role="option" aria-selected="false" data-value="book or writing">book or writing</button></li>
              <li><button class="project-picker__option" type="button" role="option" aria-selected="false" data-value="music">music</button></li>
              <li><button class="project-picker__option" type="button" role="option" aria-selected="false" data-value="something weird">something weird</button></li>
            </ul>
          </span>
          <span class="form-label">(what kind of thing)</span>
        </span>
        . The short version is
        <label class="note-field note-field--wide">
          <input type="text" name="message" required>
          <span class="form-label">(the messy middle is welcome)</span>
        </label>
        . You can write me back at
        <label class="note-field note-field--email">
          <input type="email" name="email" autocomplete="email" required>
          <span class="form-label">(your email)</span>
        </label>
        .
      </div>
      <button type="submit">Send the note</button>
      <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>

<div class="bottom-bar">
  <div class="bottom-bar-inner">
  <span class="bottom-cat-wrap">
    <img class="bottom-cat" src="images/2-Cats-pico.png" alt="Illustration of a cat peeking up">
    <img class="bottom-cat-wink" src="images/2-Cats-pico-wink.png" alt="" aria-hidden="true">
    <img class="bottom-cat-closed" src="images/2-Cats-pico-closed.png" alt="" aria-hidden="true">
    <img class="bottom-cat-half" src="images/2-Cats-pico-half.png" alt="" aria-hidden="true">
  </span>
  <nav class="bottom-nav" aria-label="Primary">
    <a href="index.html">Home</a><span class="sep">|</span><a href="work.html">Work</a><span class="sep">|</span><a href="about.html">About</a><span class="sep">|</span><a href="book.html">Books</a><span class="sep">|</span><a href="contact.html" class="current">Contact</a>
  </nav>
  </div>
</div>

<script>
(() => {
  const picker = document.querySelector('[data-project-picker]');
  const input = document.querySelector('#project-value');
  if (!picker || !input) return;

  const trigger = picker.querySelector('.project-picker__button');
  const options = [...picker.querySelectorAll('.project-picker__option')];
  if (!trigger || !options.length) return;

  const setOpen = (isOpen) => {
    picker.classList.toggle('is-open', isOpen);
    trigger.setAttribute('aria-expanded', String(isOpen));
  };

  const chooseOption = (option) => {
    const value = option.dataset.value || option.textContent.trim();
    input.value = value;
    trigger.textContent = value;
    options.forEach((item) => {
      const isSelected = item === option;
      item.classList.toggle('is-selected', isSelected);
      item.setAttribute('aria-selected', String(isSelected));
    });
    setOpen(false);
    trigger.focus();
  };

  trigger.addEventListener('click', () => setOpen(!picker.classList.contains('is-open')));
  options.forEach((option) => option.addEventListener('click', () => chooseOption(option)));
  document.addEventListener('click', (event) => {
    if (!picker.contains(event.target)) setOpen(false);
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') setOpen(false);
  });
})();

(() => {
  const form = document.querySelector('#contact-form');
  if (!form) return;
  const status = document.querySelector('#form-status');
  const button = form.querySelector('button[type="submit"]');

  const setStatus = (message, type = '') => {
    if (!status) return;
    status.textContent = message;
    status.className = `form-status${type ? ` is-${type}` : ''}`;
  };

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    form.classList.add('is-sending');
    if (button) button.disabled = true;
    setStatus('Sending...');

    fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { Accept: 'application/json' }
    })
      .then((response) => {
        if (!response.ok) throw new Error('Form submission failed.');
        form.reset();
        setStatus('Got it. I will read this soon.', 'success');
      })
      .catch(() => {
        setStatus('Something went wrong. Please try again in a moment.', 'error');
      })
      .finally(() => {
        form.classList.remove('is-sending');
        if (button) button.disabled = false;
      });
  });
})();

(() => {
  const cats = document.querySelectorAll('.bottom-cat-wrap');
  if (!cats.length || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let lastMove = '';
  let repeatCount = 0;
  const nextDelay = () => 6500 + Math.random() * 10500;
  const chooseMove = () => {
    let move = Math.random() < 0.45 ? 'love' : 'wink';
    if (move === lastMove) repeatCount += 1;
    else repeatCount = 0;
    if (repeatCount > 1 && Math.random() < 0.7) move = move === 'love' ? 'wink' : 'love';
    repeatCount = move === lastMove ? repeatCount : 0;
    lastMove = move;
    return move;
  };
  const runLoveBlink = () => {
    cats.forEach((cat) => cat.classList.add('is-love-half'));
    window.setTimeout(() => {
      cats.forEach((cat) => {
        cat.classList.remove('is-love-half');
        cat.classList.add('is-loving');
      });
    }, 180);
    window.setTimeout(() => {
      cats.forEach((cat) => {
        cat.classList.remove('is-loving');
        cat.classList.add('is-love-half');
      });
    }, 900);
    window.setTimeout(() => cats.forEach((cat) => cat.classList.remove('is-love-half')), 1120);
    return 1120;
  };
  const runWink = () => {
    cats.forEach((cat) => cat.classList.add('is-winking'));
    window.setTimeout(() => cats.forEach((cat) => cat.classList.remove('is-winking')), 420);
    return 420;
  };
  const animateCat = () => {
    const duration = chooseMove() === 'love' ? runLoveBlink() : runWink();
    window.setTimeout(animateCat, duration + nextDelay());
  };
  window.setTimeout(animateCat, 2800 + Math.random() * 6000);
})();
</script>

</body>
</html>
